[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "mcp-server-for-oscal"
dynamic = ["version"]
readme = "README.md"
dependencies = [
  # Put your dependencies here!
  "boto3>=1.42.7",
  "mcp>=2.1.1",
  "strands-agents>=1.55.0",
  "oscal-bindings==0.1.0",
  "regex>=2024.0.0",
  # Imported directly by src/; previously only available transitively via compliance-trestle
  "jsonschema>=4.26.0",
  "python-dotenv>=1.2.4",
  "requests>=2.34.2",
]
requires-python = ">=3.11"
description = "AI agent tools for Open Security Controls Assessment Language (OSCAL)."
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
  "OSCAL",
  "compliance as code",
  "security as code",
  "compliance automation",
  "continuous compliance",
  "security assurance",
  "mcp server",
  "strands agents",
  "grc engineering",
]

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[dependency-groups]
devtest = [
  "pytest",
  "mypy",
  "boto3-stubs",
  "types-requests",
  "types-PyYAML",
  "types-regex",
  "types-jsonschema",
  "bandit",
  "pytest-asyncio",
  "hypothesis",
  "bedrock-agentcore-starter-toolkit",
]

[project.scripts]
server = "mcp_server_for_oscal.main:main"
mcp-server-for-oscal = "mcp_server_for_oscal.main:main"
mcp_server_for_oscal = "mcp_server_for_oscal.main:main"
oscal-agent = "mcp_server_for_oscal.oscal_agent:main"
oscal_agent = "mcp_server_for_oscal.oscal_agent:main"

[project.urls]
GitHub = "https://github.com/dfkunstler/mcp-server-for-oscal/"
PyPI = "https://pypi.org/project/mcp-server-for-oscal/"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
version_scheme = "no-guess-dev"
# local_scheme = "no-local-version"

# see also: tool.hatch.build.hooks.vcs below
[tool.hatch.build.hooks.vcs]
version-file = "_version.py"

[tool.hatch.envs.default]
# This controls what version of Python you want to be the default
# when running any scripts or tools to do things like debug test failures
# or do general development. 
python = "3.12"
dependency-groups = ["devtest"]
installer = "uv"

# Pin every hatch env to the versions locked in requirements.txt.
# pyproject.toml declares minimum versions (for PyPI consumers); requirements.txt
# is the lock. Without this, hatch resolves the newest versions satisfying >=.
[tool.hatch.envs.default.env-vars]
UV_CONSTRAINT = "{root}/requirements.txt"

[tool.pytest.ini_options]
addopts = ["--durations=5", "--color=yes"]
testpaths = ["tests"]
filterwarnings = ["error::pydantic.PydanticDeprecatedSince20"]


[tool.coverage.run]
source_pkgs = ["mcp_server_for_oscal"]
branch = true
parallel = true

[tool.coverage.paths]
"mcp_server_for_oscal" = [
  "src/mcp_server_for_oscal",
  "**/site-packages/mcp_server_for_oscal",
]

[tool.coverage.report]
exclude_lines = ["no cov", "if __name__ == .__main__.:", "if TYPE_CHECKING:"]
show_missing = true
# fail_under = 99

[tool.coverage.xml]
output = "private/docs/coverage/coverage.xml"

[tool.coverage.html]
directory = "private/docs/coverage/"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
isort.known-first-party = ["mcp_server_for_oscal"]
exclude = ["./build", ".hatch", "private"]
# Rules from hatch's default ruleset that don't fit this codebase:
ignore = [
  # Descriptive, f-string exception messages are preferred over
  # message-constant boilerplate.
  "TRY003", "EM101", "EM102",
  # Lazy imports are deliberate: they defer heavy/optional deps (jsonschema,
  # strands, boto3) and break import cycles in the tool registry.
  "PLC0415",
  # f-strings in log calls are used throughout; we don't rely on lazy
  # interpolation or structured log args.
  "G004",
  # MCP tools and startup checks catch broad exceptions on purpose so failures
  # are reported to the client instead of crashing the server.
  "BLE001",
  # Stylistic; moving returns into try/else rarely improves clarity here.
  "TRY300",
  # Handled errors are logged without tracebacks on purpose; most are
  # re-raised or reported to the MCP client.
  "TRY400",
  # Raising inside try to share one handler is an accepted pattern here.
  "TRY301",
  # Explicit append loops read better than extend(generator) for the
  # multi-field dict builders in oscal_store / validate_oscal_content.
  "PERF401",
]

[tool.ruff.lint.per-file-ignores]
# Tests can use magic values, assertions, relative imports, private access
# (white-box tests), unused fixture args (fixtures used for side effects),
# hardcoded temp paths, and broad pytest.raises / assert-in-except patterns.
"tests/**/*" = [
  "PLR2004", "S101", "TID252", "PLC0415",
  "SLF001", "ARG001", "ARG002", "S108", "S104", "PT011", "PT017", "RUF012",
  # Unicode test data and docstrings intentionally contain non-ASCII text.
  "RUF001", "RUF002", "RUF003",
  # Nested `with patch(...)` / `with pytest.raises(...)` keeps the raises
  # scope visually distinct.
  "SIM117",
]
# Dynamic SQL composes only internal column/clause fragments; all values are
# bound parameters. Each site carries a bandit `# nosec B608` annotation.
"src/mcp_server_for_oscal/tools/oscal_store.py" = ["S608"]
# The urllib3/charset warning filter must be installed before importing boto3.
"src/mcp_server_for_oscal/oscal_agent.py" = ["E402"]
# Build scripts drive OscalStore internals directly to populate the bundled DB.
"bin/**/*" = ["SLF001"]

[tool.hatch.build]
directory = "./build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server_for_oscal"]
artifacts = ["src/mcp_server_for_oscal/oscal_store.db", "src/mcp_server_for_oscal/hashes.json"]

[tool.hatch.envs.default.scripts]
# These are scripts you can run using `hatch run <script-name>`
update = [
  # Re-lock requirements.txt to the latest versions allowed by pyproject.toml,
  # then sync this env to the new lock. UV_CONSTRAINT is unset for the compile
  # step, otherwise the existing lock would prevent any upgrade.
  "env -u UV_CONSTRAINT uv pip compile --upgrade --universal --python-version 3.11 --group devtest -o requirements.txt pyproject.toml",
  "uv pip install -r requirements.txt",
]

rehash = [
  # Regenerate hash files for bundled content
  "hatch run bin/update_hashes.py src/mcp_server_for_oscal/oscal_schemas",
  "git add src/mcp_server_for_oscal/oscal_schemas/hashes.json",
  "hatch run bin/update_hashes.py data/oscal_docs",
  "git add data/oscal_docs/hashes.json",
  "hatch run bin/update_hashes.py data/component_definitions",
  "git add data/component_definitions/hashes.json",
  # Bundled OSCAL SQLite database hash is managed by build-db script
  # (updates hashes.json at package root level)
  "git add src/mcp_server_for_oscal/hashes.json"
]

# TODO: monitor OSCAL GitHub project for changes and trigger PRs in our project
# Updates contents of `src/mcp_server_for_oscal/oscal_schemas`, overwriting existing files
update-oscal-schemas = ["bin/update-oscal-schemas.sh"]
# TODO: monitor Awesome OSCAL GitHub project for changes and trigger PRs in our project
# https://github.com/dfkunstler/mcp-server-for-oscal/issues/20
update-awesome-oscal = [
  '''curl -L -o data/oscal_docs/awesome-oscal.md \
  https://raw.githubusercontent.com/oscal-club/awesome-oscal/refs/heads/main/README.md''',
]

release = ["hatch run tests", "git status", "./bin/refresh-nist-docs.sh", "build-db", "hatch build", "build-mcpb"]

typing = [
  # Type checking using mypy
  "rm -rf .mypy_cache && mkdir -p .mypy_cache",
  # Stub packages are declared (and locked) in the devtest group.
  "mypy src/mcp_server_for_oscal tests",
]

# Start the MCP server for remote testing/development
http-server = [
  "python -m mcp_server_for_oscal.main --transport streamable-http",
]

# Start the OSCAL agent in interactive mode
oscal-agent = [
  "python -m mcp_server_for_oscal.oscal_agent {args}",
]

bandito = [
  # Run bandit security scanner against src, then tests. This cannot be 
  # named `bandit` because it creates a circular reference that hatch can't resolve.
  "mkdir -p private/docs/bandit",
  "bandit -r src/mcp_server_for_oscal | tee private/docs/bandit/src.txt",
  "bandit -s B101 -r tests | tee private/docs/bandit/tests.txt",
]

checkout-oscal-steering = [
  "git submodule update --init --depth 1 conf/powers/oscal/steering/oscal-pages",
  "cd conf/powers/oscal/steering/oscal-pages && git sparse-checkout set --no-cone && git sparse-checkout set src/content/learn/concepts"
]

tests = ["typing", "hatch test --exitfirst --all --cover --junitxml private/docs/pytest.xml", "hatch run bandito"]

build-db = [
  "python bin/build_oscal_db.py",
]

# Package the most recently built wheel as an MCP Bundle (.mcpb) in ./build.
# Run `hatch build` first. Requires uv and npx (Node.js).
build-mcpb = [
  "python bin/build_mcpb.py",
]

build-agentcore-container = [
  "finch build -f conf/agentcore/Dockerfile -t bedrock-agentcore-oscal --build-arg VERSION=$(hatch version) ."
]

[tool.hatch.envs.hatch-test]
parallel = true
installer = "uv"
extra-dependencies = ["pytest-asyncio", "hypothesis"]

[tool.hatch.envs.hatch-test.env-vars]
UV_CONSTRAINT = "{root}/requirements.txt"

[tool.hatch.envs.hatch-test.scripts]
run = "pytest{env:HATCH_TEST_ARGS:} {args}"
run-cov = "coverage run -m pytest{env:HATCH_TEST_ARGS:} {args}"
cov-combine = "coverage combine"
cov-report = ["coverage report", "coverage html", "coverage xml"]

[[tool.hatch.envs.hatch-test.matrix]]
python = ["3.11", "3.12"]

# This is necessary to use 'uv' as the resolver if this is the top-level package
# in a monorepo (which is usually the case).  Remove this if copying the
# package into a monorepo
[tool.uv.workspace]
