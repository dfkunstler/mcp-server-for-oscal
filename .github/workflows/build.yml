# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Build on pushes to main and on release tags only. Feature branches are
  # covered by the pull_request trigger, which avoids duplicate push + PR runs.
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Cancel superseded runs for the same PR/branch. Never cancel runs on main or
# tags so every merged commit and release build completes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Same step text on Windows (Git Bash) and POSIX runners; adds pipefail on Linux.
defaults:
  run:
    shell: bash

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          # `hatch run release` runs `hatch test --all`, so install every matrix
          # interpreter. The last entry (3.14) becomes the default `python`.
          python-version: |
            3.13
            3.14

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # uv is used to lock the MCPB bundle's dependencies
      - uses: astral-sh/setup-uv@v6

      - name: Validate server.json against MCP Registry schema
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher && sudo mv mcp-publisher /usr/local/bin/
          mcp-publisher validate

      # Runs a set of commands using the runners shell
      - name: Run a multi-line script
        run: |
          pip install -U hatch
          hatch run release
        # env:
        #   PIP_COMPILE_DISABLE: "1"          

      - name: Upload various test results
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: private/docs/
        # Use always() to always run this step to publish test results when there are test failures
        if: ${{ always() }}

      - name: Upload python packages
        uses: actions/upload-artifact@v4
        with:
          name: python-packages
          path: |
            build/*.whl
            build/*.tar.gz
          if-no-files-found: error

      - name: Upload MCP Bundle
        uses: actions/upload-artifact@v4
        with:
          name: mcpb
          path: build/*.mcpb
          if-no-files-found: error

  # Run the pytest suite (including the stdio smoke tests in source mode) on
  # every supported OS x Python combination. Runs in parallel with `build`.
  # Only `hatch test` here: the `typing`/`bandito` scripts use POSIX shell
  # commands, and `build` already runs them through `hatch run release`.
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.13", "3.14"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5
        with:
          # hatch-vcs derives the version from git tags
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      # hatch ships uv as a dependency, so the hatch-test env's
      # `installer = "uv"` needs no separate setup-uv step.
      - name: Run tests
        run: |
          pip install -U hatch
          hatch test -py ${{ matrix.python }}

  # Check the shipped MCP Bundle on the OSes Claude Desktop runs on. Tests the
  # exact .mcpb uploaded by `build` (the bytes `draft-release` attaches) rather
  # than rebuilding it per OS. Syncs on 3.13, the minimum supported Python,
  # since the matrix and `build` already cover 3.14.
  mcpb:
    name: mcpb (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Same CLI version spec as MCPB_CLI in bin/build_mcpb.py
      MCPB_CLI: "@anthropic-ai/mcpb@2"

    steps:
      - uses: actions/checkout@v5
        with:
          # hatch-vcs derives the version from git tags
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # uv syncs the unpacked bundle from its uv.lock
      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install hatch
        run: pip install -U hatch

      - name: Download MCP Bundle
        uses: actions/download-artifact@v4
        with:
          name: mcpb
          path: dist/

      - name: Locate bundle
        run: |
          shopt -s nullglob
          files=(dist/*.mcpb)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one dist/*.mcpb, found ${#files[@]}: ${files[*]}"
            exit 1
          fi
          echo "MCPB_FILE=${files[0]}" >> "$GITHUB_ENV"

      - name: Unpack shipped bundle
        run: npx -y "$MCPB_CLI" unpack "$MCPB_FILE" staged/

      - name: Validate manifest
        run: npx -y "$MCPB_CLI" validate staged/manifest.json

      - name: Repack bundle
        run: npx -y "$MCPB_CLI" pack staged/ repacked.mcpb

      - name: Unpack repacked bundle
        run: npx -y "$MCPB_CLI" unpack repacked.mcpb bundle/

      - name: Sync bundle dependencies
        run: uv sync --frozen --directory bundle --python 3.13

      # Runs both protocol eras of the stdio smoke test against the bundle
      - name: Smoke test bundle over stdio
        env:
          OSCAL_SMOKE_BUNDLE_DIR: bundle
        run: hatch test -py 3.13 tests/test_integration_stdio_smoke.py

  # Create a draft GitHub release for version tags that point at a commit on
  # main, and attach the build artifacts. Publishing the draft (manually) is
  # what triggers release.yml, so nothing is published automatically here.
  # Waits for all platforms (build, cross-OS tests, and bundle checks); a
  # failed or skipped need skips this job, so no draft is made unless all pass.
  draft-release:
    needs: [build, test, mcpb]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify tag points to a commit on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} (${GITHUB_SHA}) is not on main; skipping release."
            exit 1
          fi

      - name: Download python packages
        uses: actions/download-artifact@v4
        with:
          name: python-packages
          path: dist/

      - name: Download MCP Bundle
        uses: actions/download-artifact@v4
        with:
          name: mcpb
          path: dist/

      - name: Create draft release with artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist/
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} exists; uploading artifacts."
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --draft \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
